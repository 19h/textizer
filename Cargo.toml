[package]
name = "textizer"
version = "0.1.0"
edition = "2024"
description = "Deterministic bitmap text packing for native and WebAssembly clients"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "textizer"
path = "src/main.rs"

[dependencies]
png = "0.17.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
